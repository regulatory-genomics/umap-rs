[package]
name = "umap-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"
description = "Rust port of the core UMAP (Uniform Manifold Approximation and Projection) algorithm from umap-learn"
repository = "https://github.com/example/umap-rs"
readme = "README.md"
keywords = ["umap", "dimensionality-reduction", "manifold-learning", "machine-learning"]
categories = ["science", "mathematics"]

[dependencies]
ndarray = "0.16"
rayon = "1.10"
thiserror = "2"
faer = "0.24"

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"

# Gate tests run full embeddings on thousands of points; debug-mode numeric
# kernels are 20-50x slower, so compile the test profile optimized.
[profile.test]
opt-level = 2

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"

[lints.rust]
# The parallel SGD kernel uses Hogwild!-style shared mutation, matching the
# numba parallel=True semantics of the Python original.
unsafe_code = "allow"
